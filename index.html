<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#00B2A9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BadminClub">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Quản lý CLB cầu lông</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&family=Oswald:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  (function() {
    try {
      var k = 'badminclub.theme';
      var t = localStorage.getItem(k) ||
        (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.setAttribute('data-theme-mode', 'glamorous');
      document.documentElement.style.colorScheme = t;
    } catch (e) {}

    window.addEventListener('error', function(e) {
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && (!root.childNodes || root.childNodes.length === 0)) {
          var box = document.getElementById('app-boot-error');
          if (!box) {
            box = document.createElement('div');
            box.id = 'app-boot-error';
            box.style.cssText = 'position:fixed;inset:0;padding:24px;background:#0B1220;color:#f87171;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:14px;line-height:1.5;z-index:99999;overflow:auto;';
            document.body.appendChild(box);
          }
          var msg = (e && e.message) ? e.message : String(e);
          var src = (e && e.filename) ? (e.filename + ':' + e.lineno) : '';
          box.innerHTML = '<h3 style="color:#ef4444;margin-top:0">Lỗi khởi động ứng dụng</h3><pre style="background:#1e293b;padding:12px;border-radius:6px;overflow-x:auto;color:#fca5a5;white-space:pre-wrap;word-break:break-all;">' + msg + (src ? '\n\n' + src : '') + '</pre><p style="color:#94a3b8;font-size:12px">Vui lòng chụp ảnh màn hình này để được hỗ trợ.</p>';
        }
      }, 500);
    });
  })();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
